<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shalu AI 11.3 - 3D Anime</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c1d;color:#fff;font-family:Segoe UI,Arial,sans-serif}
#app{width:100%;height:100%;position:relative}
#stage{position:absolute;inset:0}
#top{position:absolute;top:20px;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
#top h1{margin:0;font-size:32px;letter-spacing:1px}#status{margin-top:8px;color:#36e59a;font-weight:700}
#panel{position:absolute;left:22px;bottom:22px;right:22px;display:flex;gap:10px;align-items:center;z-index:6;background:rgba(7,11,28,.78);backdrop-filter:blur(10px);padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.1)}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#6657ff;color:white}button:hover{filter:brightness(1.12)}
button.secondary{background:#26314f}button.stop{background:#e74c67}
#msg{flex:1;background:#121a32;border:1px solid #293452;border-radius:10px;color:#fff;padding:12px;outline:none}
#emotion{background:#121a32;color:white;border:1px solid #293452;border-radius:10px;padding:11px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#080c1d;z-index:20}
#loading.hide{display:none}
#badge{position:absolute;right:22px;top:22px;z-index:6;color:#b7c2e5;font-size:13px}
</style>
</head>
<body>
<div id="app"><div id="stage"></div><div id="loading">Loading Shalu 3D model…</div>
<div id="top"><h1>🤖 SHALU AI 11.3</h1><div id="status">● Loading…</div></div>
<div id="badge">VRM 1.0 • Anime Avatar</div>
<div id="panel">
<select id="emotion"><option value="neutral">Neutral</option><option value="happy">Happy 😊</option><option value="sad">Sad 😢</option><option value="angry">Angry 😠</option><option value="surprised">Surprised 😮</option><option value="relaxed">Relaxed 😌</option></select>
<input id="msg" placeholder="Type something Shalu should say…">
<button id="speak">SPEAK 🔊</button><button class="secondary" id="stop">STOP</button>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin, VRMUtils} from '@pixiv/three-vrm';

const stage=document.getElementById('stage'), status=document.getElementById('status'), loading=document.getElementById('loading');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080c1d);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100); camera.position.set(0,1.35,5.8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfd6ff,0x302038,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.5); key.position.set(2,4,4); scene.add(key);
const rim=new THREE.DirectionalLight(0xff6bc8,2); rim.position.set(-3,2,-3); scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.6,64),new THREE.MeshStandardMaterial({color:0x121a32,roughness:.9})); floor.rotation.x=-Math.PI/2; floor.position.y=-1.65; scene.add(floor);
let vrm=null, mixer=null, speaking=false, speakUntil=0, currentEmotion='neutral', blink=0, nextBlink=performance.now()+1800;
const clock=new THREE.Clock();
const loader=new GLTFLoader(); loader.register(parser=>new VRMLoaderPlugin(parser));
loader.load('./SHALU.vrm',gltf=>{
 vrm=gltf.userData.vrm; scene.add(vrm.scene);
 // normalize character size/position
 const box=new THREE.Box3().setFromObject(vrm.scene), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
 const s=3.15/Math.max(size.x,size.y,size.z); vrm.scene.scale.setScalar(s); vrm.scene.position.set(-center.x*s,-center.y*s-1.1,0);
 status.textContent='● Shalu is ready'; loading.classList.add('hide');
 setEmotion('neutral');
},xhr=>{ if(xhr.total) status.textContent='● Loading Shalu '+Math.round(xhr.loaded/xhr.total*100)+'%'; },err=>{console.error(err);status.textContent='● Model load error';loading.textContent='Could not load SHALU.vrm. Check the CMD/server window.'});
function setEmotion(name){ if(!vrm?.expressionManager)return; currentEmotion=name; const presets=['happy','sad','angry','surprised','relaxed','neutral']; for(const p of presets) vrm.expressionManager.setValue(p,0); vrm.expressionManager.setValue(name,1); }
function mouth(){ if(!vrm?.expressionManager)return; const names=['aa','ih','ou','ee','oh']; names.forEach(n=>vrm.expressionManager.setValue(n,0)); if(speaking){ const n=names[Math.floor(performance.now()/95)%names.length]; vrm.expressionManager.setValue(n,.65); } }
function autoBlink(now){ if(!vrm?.expressionManager)return; if(now>nextBlink){blink=1; nextBlink=now+2200+Math.random()*3500;} if(blink>0){blink=Math.max(0,blink-.075); vrm.expressionManager.setValue('blink',blink);}}
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta(),now=performance.now(); if(vrm){vrm.update(dt); autoBlink(now); mouth(); if(now>speakUntil){speaking=false;} const sway=Math.sin(now*.0012)*.012; vrm.scene.rotation.y=sway; if(vrm.lookAt?.target) vrm.lookAt.target=camera;} renderer.render(scene,camera)} animate();
function speak(text){if(!text.trim())return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=/[\u0A80-\u0AFF]/.test(text)?'gu-IN':/[\u0900-\u097F]/.test(text)?'hi-IN':'en-IN'; u.rate=.95; u.pitch=1.12; const voices=speechSynthesis.getVoices(); const preferred=voices.find(v=>/female|zira|heera|google.*female/i.test(v.name+' '+v.voiceURI)&&v.lang.startsWith(u.lang.split('-')[0])); if(preferred)u.voice=preferred; u.onstart=()=>{speaking=true;speakUntil=performance.now()+60000;};u.onend=()=>speaking=false; speechSynthesis.speak(u);}
document.getElementById('emotion').onchange=e=>setEmotion(e.target.value);
document.getElementById('speak').onclick=()=>speak(document.getElementById('msg').value);
document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();speaking=false;};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
