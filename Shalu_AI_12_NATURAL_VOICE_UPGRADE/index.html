<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHALU AI 12.0 — Natural Voice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a12;color:#f5f6fb;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}
#app{height:100vh;display:grid;grid-template-columns:1fr 370px}
#stage{position:relative;min-width:0}
canvas{display:block;width:100%;height:100%}
#badge{position:absolute;left:20px;top:18px;padding:9px 13px;border:1px solid #30374a;background:#101522dd;border-radius:12px;font-size:13px}
#panel{padding:22px;background:#0d1019;border-left:1px solid #252b3a;display:flex;flex-direction:column;gap:11px;overflow:auto}
h1{margin:0;font-size:25px}.sub{font-size:13px;color:#aab2c4;line-height:1.4}
label{font-size:12px;color:#aeb6c8;margin-top:3px}
select,textarea,button{width:100%;border:1px solid #30374a;background:#151a27;color:#f5f6fb;border-radius:11px;padding:11px;font:inherit}
textarea{height:125px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{cursor:pointer;font-weight:700}
#speak{background:#6e4cff;border-color:#6e4cff}
#test{background:#182033}
.small{font-size:11px;color:#838da2;line-height:1.5}
.pill{display:inline-block;margin-right:5px;padding:4px 7px;border-radius:999px;background:#171d2b;color:#aeb7ca;font-size:10px}
@media(max-width:850px){
#app{grid-template-columns:1fr}
#panel{position:absolute;right:10px;top:10px;width:340px;max-height:calc(100vh - 20px);border:1px solid #30374a;border-radius:16px}
}
</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <div id="badge">● <span id="status">Loading Shalu…</span></div>
  </section>
  <aside id="panel">
    <h1>SHALU AI 12.0 🎀</h1>
    <div class="sub">3D anime assistant • Natural female voice</div>
    <div><span class="pill">Online voices preferred</span><span class="pill">No API key</span></div>

    <label>Voice</label>
    <select id="voice"></select>

    <label>Voice style</label>
    <select id="style">
      <option value="natural" selected>Natural Female</option>
      <option value="soft">Soft & Gentle</option>
      <option value="bright">Bright Assistant</option>
      <option value="neutral">Neutral</option>
    </select>

    <label>Emotion</label>
    <select id="emotion">
      <option value="neutral">Neutral</option>
      <option value="happy">Happy</option>
      <option value="relaxed">Relaxed</option>
      <option value="surprised">Surprised</option>
      <option value="sad">Sad</option>
      <option value="angry">Angry</option>
    </select>

    <label>Text</label>
    <textarea id="text">Hello Prince! I am Shalu. How can I help you today?</textarea>

    <div class="row">
      <button id="test">TEST VOICE 🔊</button>
      <button id="stop">STOP</button>
    </div>
    <button id="speak">SPEAK 🎙️</button>

    <div class="small">
      The reference video is used only as a style target: soft, natural,
      conversational anime-assistant delivery. This app does not copy or clone
      the speaker's voice.
    </div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const stage=document.getElementById("stage");
const status=document.getElementById("status");
const voiceSelect=document.getElementById("voice");
const styleSelect=document.getElementById("style");
const emotionSelect=document.getElementById("emotion");
const textBox=document.getElementById("text");

let vrm=null, speaking=false, blinkClock=0, mouthPulse=0;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080a12);
const camera=new THREE.PerspectiveCamera(28,1,.1,100);
camera.position.set(0,1.35,3.1);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x2d3040,2.4));
const key=new THREE.DirectionalLight(0xffffff,2.3); key.position.set(1.6,2.7,2); scene.add(key);
const fill=new THREE.DirectionalLight(0xb9c4ff,1.0); fill.position.set(-2,1,1); scene.add(fill);

const loader=new GLTFLoader();
loader.register(p=>new VRMLoaderPlugin(p));

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
addEventListener("resize",resize);

function emotion(name){
  if(!vrm?.expressionManager)return;
  for(const n of ["happy","sad","angry","surprised","relaxed","neutral"])
    vrm.expressionManager.setValue(n,n===name?(name==="neutral"?1:.72):0);
  vrm.expressionManager.update();
}

function mouth(v){
  if(!vrm?.expressionManager)return;
  const names=["aa","ih","ou","ee","oh"];
  const idx=Math.floor((performance.now()/75)%names.length);
  for(const n of names) vrm.expressionManager.setValue(n,0);
  if(v>0) vrm.expressionManager.setValue(names[idx],Math.min(v,.78));
  vrm.expressionManager.update();
}

function blink(){
  if(!vrm?.expressionManager)return;
  vrm.expressionManager.setValue("blink",1); vrm.expressionManager.update();
  setTimeout(()=>{
    if(vrm?.expressionManager){vrm.expressionManager.setValue("blink",0);vrm.expressionManager.update();}
  },125);
}

loader.load("./SHALU.vrm",gltf=>{
  vrm=gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  scene.add(vrm.scene);

  const box=new THREE.Box3().setFromObject(vrm.scene);
  const c=box.getCenter(new THREE.Vector3());
  const s=box.getSize(new THREE.Vector3());
  vrm.scene.position.x-=c.x;
  vrm.scene.position.y-=box.min.y;
  vrm.scene.position.z-=c.z;

  camera.position.set(0,Math.max(1.15,s.y*.55),Math.max(2.65,s.y*1.18));
  camera.lookAt(0,Math.max(.9,s.y*.52),0);
  emotion("neutral");
  status.textContent="Shalu is ready";
},undefined,e=>{
  console.error(e); status.textContent="Could not load SHALU.vrm";
});

function voiceScore(v){
  const n=(v.name+" "+v.voiceURI).toLowerCase();
  let score=0;
  if(/online/.test(n))score+=100;
  if(/natural/.test(n))score+=80;
  if(/aria|jenny|sonia|zira|samantha|ava|emma|susan|hazel/.test(n))score+=40;
  if(/^en(-|_)/.test(v.lang))score+=25;
  if(!v.localService)score+=15;
  if(/male|david|mark|guy|roger|brian|eric|liam/.test(n))score-=100;
  return score;
}

function loadVoices(){
  const all=speechSynthesis.getVoices();
  const english=all.filter(v=>/^en(-|_)/i.test(v.lang));
  english.sort((a,b)=>voiceScore(b)-voiceScore(a));
  voiceSelect.innerHTML="";
  english.forEach(v=>{
    const o=document.createElement("option");
    o.value=v.voiceURI;
    o.textContent=`${v.name} — ${v.lang}${v.localService?"":" • online"}`;
    voiceSelect.appendChild(o);
  });
  if(!english.length){
    const o=document.createElement("option"); o.textContent="No English voices found"; voiceSelect.appendChild(o);
  }
}
speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function selectedVoice(){
  const voices=speechSynthesis.getVoices();
  return voices.find(v=>v.voiceURI===voiceSelect.value) || voices.sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}

function settings(){
  const s=styleSelect.value;
  if(s==="soft")return {rate:.90,pitch:1.10};
  if(s==="bright")return {rate:.98,pitch:1.14};
  if(s==="neutral")return {rate:.98,pitch:1.02};
  return {rate:.93,pitch:1.08};
}

function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=selectedVoice(), st=settings();
  if(v){u.voice=v;u.lang=v.lang;}
  u.rate=st.rate; u.pitch=st.pitch; u.volume=1;

  speaking=true;
  status.textContent=`Speaking • ${v?.name||"voice"}`;
  emotion(emotionSelect.value);

  u.onstart=()=>{speaking=true;mouth(.25);};
  u.onboundary=()=>{mouthPulse=1; mouth(.45);};
  u.onend=()=>{speaking=false;mouth(0);status.textContent="Shalu is ready";};
  u.onerror=()=>{speaking=false;mouth(0);status.textContent="Voice error — try another voice";};
  speechSynthesis.speak(u);
}

document.getElementById("speak").onclick=()=>{
  const t=textBox.value.trim();
  if(t)speak(t);
};

document.getElementById("test").onclick=()=>{
  speak("Hi Prince. I am Shalu. It's nice to talk with you.");
};

document.getElementById("stop").onclick=()=>{
  speechSynthesis.cancel(); speaking=false; mouth(0); status.textContent="Shalu is ready";
};

emotionSelect.onchange=()=>emotion(emotionSelect.value);

function animate(t){
  requestAnimationFrame(animate);
  if(vrm){
    vrm.update(.016);
    vrm.scene.rotation.y=Math.sin(t*.00055)*.025;
    if(speaking){
      mouthPulse*=.86;
      if(mouthPulse<.03) mouth(.14+.12*(.5+.5*Math.sin(t*.014)));
    }
    blinkClock+=.016;
    if(blinkClock>3.8+Math.random()*3.5){blink();blinkClock=0;}
  }
  renderer.render(scene,camera);
}
animate(0);
</script>
</body>
</html>
