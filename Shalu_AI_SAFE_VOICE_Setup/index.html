<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHALU AI — Safe Voice</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#090b12;color:#f3f4f8;font-family:Arial,sans-serif;overflow:hidden}
#app{height:100vh;display:grid;grid-template-columns:1fr 360px}
#stage{position:relative;min-width:0} canvas{display:block;width:100%;height:100%}
#status{position:absolute;top:18px;left:18px;padding:9px 13px;border-radius:12px;background:#111522cc;border:1px solid #2b3144;font-size:13px}
#panel{padding:22px;background:#0d1019;border-left:1px solid #252a38;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:24px} .sub{color:#aab0c0;font-size:13px}
label{font-size:12px;color:#aeb5c6;margin-top:5px}
select,textarea,button{width:100%;border-radius:11px;border:1px solid #303748;background:#151a27;color:#f3f4f8;padding:11px;font:inherit}
textarea{height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{cursor:pointer;font-weight:700} #speak{background:#6d4aff;border-color:#6d4aff}
button:hover{filter:brightness(1.1)}
.small{font-size:11px;color:#81899b;line-height:1.45}
@media(max-width:850px){#app{grid-template-columns:1fr}#panel{position:absolute;right:10px;top:10px;width:330px;border:1px solid #303748;border-radius:16px;max-height:calc(100vh - 20px);overflow:auto}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="status">Loading Shalu…</div></div>
  <aside id="panel">
    <h1>SHALU AI 🎀</h1>
    <div class="sub">3D assistant • Safe voice mode</div>

    <label>Female voice</label>
    <select id="voice"></select>

    <label>Emotion</label>
    <select id="emotion">
      <option value="neutral">Neutral</option>
      <option value="happy">Happy</option>
      <option value="sad">Sad</option>
      <option value="angry">Angry</option>
      <option value="surprised">Surprised</option>
      <option value="relaxed">Relaxed</option>
    </select>

    <label>Text</label>
    <textarea id="text">Hello Prince! I am Shalu. How can I help you today?</textarea>

    <div class="row">
      <button id="speak">SPEAK</button>
      <button id="stop">STOP</button>
    </div>

    <div class="small">
      This version uses browser/Windows speech voices, so no API key is stored
      in the project. Voice names and quality depend on the voices available
      on this PC and in Microsoft Edge.
    </div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const stage = document.getElementById("stage");
const status = document.getElementById("status");
const voiceSelect = document.getElementById("voice");
const emotionSelect = document.getElementById("emotion");
const textBox = document.getElementById("text");

let vrm = null;
let speaking = false;
let blinkClock = 0;
let mouthClock = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b12);

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
camera.position.set(0, 1.25, 3.3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2.2));
const key = new THREE.DirectionalLight(0xffffff,2.2);
key.position.set(1.5,2.5,2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xaab7ff,1.1);
fill.position.set(-2,1,1);
scene.add(fill);

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
addEventListener("resize",resize);

function setEmotion(name){
  if(!vrm?.expressionManager) return;
  const names=["happy","sad","angry","surprised","relaxed"];
  for(const n of names) vrm.expressionManager.setValue(n, n===name ? 0.8 : 0);
  vrm.expressionManager.setValue("neutral", name==="neutral" ? 1 : 0);
  vrm.expressionManager.update();
}

function setMouth(v){
  if(!vrm?.expressionManager) return;
  const names=["aa","ih","ou","ee","oh"];
  const n=names[Math.floor(Math.random()*names.length)];
  for(const x of names) vrm.expressionManager.setValue(x,0);
  if(v>0.02) vrm.expressionManager.setValue(n,Math.min(v,0.8));
  vrm.expressionManager.update();
}

function blink(){
  if(!vrm?.expressionManager) return;
  vrm.expressionManager.setValue("blink",1);
  vrm.expressionManager.update();
  setTimeout(()=>{
    if(vrm?.expressionManager){
      vrm.expressionManager.setValue("blink",0);
      vrm.expressionManager.update();
    }
  },120);
}

loader.load("./SHALU.vrm",
  gltf=>{
    vrm=gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    scene.add(vrm.scene);

    // Center the model using its bounds.
    const box=new THREE.Box3().setFromObject(vrm.scene);
    const center=box.getCenter(new THREE.Vector3());
    vrm.scene.position.x-=center.x;
    vrm.scene.position.y-=box.min.y;
    vrm.scene.position.z-=center.z;

    const size=box.getSize(new THREE.Vector3());
    camera.position.set(0, Math.max(1.0,size.y*0.55), Math.max(2.6,size.y*1.25));
    camera.lookAt(0, Math.max(0.9,size.y*0.52), 0);

    setEmotion("neutral");
    status.textContent="Shalu is ready 🎀";
  },
  undefined,
  err=>{console.error(err);status.textContent="Could not load SHALU.vrm";});

function loadVoices(){
  const voices=speechSynthesis.getVoices();
  voiceSelect.innerHTML="";
  const females=voices.filter(v=>{
    const n=(v.name+" "+v.voiceURI).toLowerCase();
    return /female|zira|aria|jenny|sonia|hazel|susan|linda|samantha|ava|emma|serena|natasha|online/.test(n)
      && /^en(-|_)/i.test(v.lang);
  });
  const list=(females.length?females:voices.filter(v=>/^en(-|_)/i.test(v.lang)));
  list.forEach(v=>{
    const o=document.createElement("option");
    o.value=v.voiceURI;
    o.textContent=`${v.name} — ${v.lang}${v.localService?"":" • online"}`;
    voiceSelect.appendChild(o);
  });
  if(!list.length){
    const o=document.createElement("option");
    o.textContent="No English voice found";
    voiceSelect.appendChild(o);
  }
}
speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function selectedVoice(){
  const voices=speechSynthesis.getVoices();
  return voices.find(v=>v.voiceURI===voiceSelect.value) || voices.find(v=>/female|zira|aria|jenny|sonia|hazel|online/i.test(v.name)) || voices[0];
}

document.getElementById("speak").onclick=()=>{
  speechSynthesis.cancel();
  const text=textBox.value.trim();
  if(!text) return;
  const u=new SpeechSynthesisUtterance(text);
  const v=selectedVoice();
  if(v) {u.voice=v; u.lang=v.lang;}
  u.rate=0.96;
  u.pitch=1.08;
  u.volume=1;
  speaking=true;
  status.textContent=`Speaking with ${v?.name||"browser voice"}…`;
  u.onend=()=>{speaking=false;setMouth(0);status.textContent="Shalu is ready 🎀";};
  u.onerror=()=>{speaking=false;setMouth(0);status.textContent="Voice error — try another voice";};
  speechSynthesis.speak(u);
};

document.getElementById("stop").onclick=()=>{
  speechSynthesis.cancel(); speaking=false; setMouth(0); status.textContent="Shalu is ready 🎀";
};
emotionSelect.onchange=()=>setEmotion(emotionSelect.value);

function animate(t){
  requestAnimationFrame(animate);
  if(vrm){
    vrm.update(0.016);
    // Gentle idle movement.
    vrm.scene.rotation.y=Math.sin(t*0.00055)*0.025;
    if(speaking){
      mouthClock=t*0.012;
      setMouth(0.18+0.22*(0.5+0.5*Math.sin(mouthClock)));
    }
    blinkClock+=0.016;
    if(blinkClock>3.5+Math.random()*3.5){blink();blinkClock=0;}
  }
  renderer.render(scene,camera);
}
animate(0);
</script>
</body>
</html>
